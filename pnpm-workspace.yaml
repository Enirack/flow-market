packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  workerd: true
# Versions forcees pour corriger des vulnerabilites signalees par `pnpm audit`
# sur des dependances transitives que les paquets amont n'ont pas encore mises
# a jour (voir docs/security.md).
overrides:
  multer: ^2.3.0
  proxy-addr: ^2.0.8
  brace-expansion@5: ^5.0.12
  brace-expansion@1: ^1.1.21
  source-map-js: ^1.2.2
  fast-uri: ^3.1.8
  mysql2: ^3.22.0
  sharp: ^0.35.5
  deepmerge-ts: ^8.0.0
